<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot_name }} — AI Assistant</title>
    <style>
        :root {
            --bg: #07111f;
            --panel: rgba(14, 28, 48, 0.82);
            --panel-2: rgba(22, 40, 66, 0.78);
            --text: #eef6ff;
            --muted: #9fb3ca;
            --accent: #7dd3fc;
            --accent-2: #a78bfa;
            --border: rgba(148, 163, 184, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 10% 15%, rgba(125, 211, 252, .16), transparent 28%),
                radial-gradient(circle at 90% 80%, rgba(167, 139, 250, .14), transparent 30%),
                var(--bg);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .shell {
            width: min(980px, 100%);
            height: min(760px, calc(100vh - 48px));
            min-height: 560px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--panel);
            backdrop-filter: blur(22px);
            box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
        }

        header {
            padding: 22px 26px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 23px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #07111f;
            box-shadow: 0 10px 30px rgba(125, 211, 252, .18);
        }

        h1 { margin: 0; font-size: 19px; }
        .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        #chat {
            padding: 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 78%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            animation: rise .2s ease-out;
        }

        .bot {
            align-self: flex-start;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(125, 211, 252, .22), rgba(167, 139, 250, .24));
            border: 1px solid rgba(125, 211, 252, .22);
            border-bottom-right-radius: 6px;
        }

        .composer {
            padding: 18px;
            border-top: 1px solid var(--border);
        }

        form {
            display: flex;
            gap: 10px;
            background: rgba(5, 14, 27, .55);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px;
        }

        input {
            flex: 1;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            padding: 12px 14px;
            font-size: 15px;
        }

        input::placeholder { color: #71839a; }

        button {
            border: 0;
            border-radius: 14px;
            padding: 0 19px;
            font-weight: 700;
            cursor: pointer;
            color: #07111f;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        button:disabled { opacity: .55; cursor: wait; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .shell { height: calc(100vh - 20px); min-height: 500px; border-radius: 20px; }
            #chat { padding: 18px; }
            .message { max-width: 90%; }
            header { padding: 17px; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header>
            <div class="logo">✦</div>
            <div>
                <h1>{{ bot_name }}</h1>
                <p class="subtitle">Focused AI assistant · Gemini {{ model_name }}</p>
            </div>
        </header>

        <section id="chat" aria-live="polite">
            <div class="message bot">Hello! I’m {{ bot_name }}. Ask me something within my specialized domain.</div>
        </section>

        <div class="composer">
            <form id="chat-form">
                <input id="message" autocomplete="off" placeholder="Ask a domain-related question..." required />
                <button id="send" type="submit">Send</button>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const send = document.getElementById("send");

        function addMessage(text, role) {
            const item = document.createElement("div");
            item.className = `message ${role}`;
            item.textContent = text;
            chat.appendChild(item);
            chat.scrollTop = chat.scrollHeight;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            input.focus();
            send.disabled = true;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed.");
                }

                addMessage(data.reply, "bot");
            } catch (error) {
                addMessage(error.message || "Something went wrong.", "bot");
            } finally {
                send.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
